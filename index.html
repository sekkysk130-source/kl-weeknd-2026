<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KL Weeknd">
<title>KL × The Weeknd 🎤 3–5 พ.ย.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0f;--card:#15151f;--card2:#1b1b28;--line:#2c2c3d;--tx:#f3f3f7;--mut:#a3a3b8;--acc:#ef4444;--red:#ef4444;--yel:#fbbf24;--grn:#34d399;--blu:#60a5fa;--amb:#f59e0b;--in:#10101a;--btn:#24243a;--nav:68px;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f5f8;--card:#fff;--card2:#f1eff6;--line:#dcdae4;--tx:#16151c;--mut:#5f5c6e;--acc:#dc2626;--red:#dc2626;--yel:#b45309;--grn:#047857;--blu:#1d4ed8;--amb:#b45309;--in:#fff;--btn:#ecebf2;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f5f8;--card:#fff;--card2:#f1eff6;--line:#dcdae4;--tx:#16151c;--mut:#5f5c6e;--acc:#dc2626;--red:#dc2626;--yel:#b45309;--grn:#047857;--blu:#1d4ed8;--amb:#b45309;--in:#fff;--btn:#ecebf2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sukhumvit Set","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
a{color:var(--blu)}
h1{font-size:1.12rem;margin:0;line-height:1.35}
h2{font-size:1.08rem;margin:20px 0 8px}
h3{font-size:1rem;margin:0 0 4px}
p{margin:6px 0}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.stripe{height:4px;border-radius:2px;margin-top:6px;background:linear-gradient(90deg,var(--acc),#7f1d1d 60%,transparent)}
main{padding:0 16px;max-width:680px;margin:0 auto}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;overflow-wrap:anywhere}
.card.hl{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card.sel{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.card.rt{background:var(--card2);border-style:dashed}
.card.rest{border-left:4px solid var(--grn)}
.card.hero{background:linear-gradient(135deg,rgba(239,68,68,.16),var(--card) 60%)}
.mut{color:var(--mut);font-size:.9rem}
.big{font-size:1.5rem;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.clock{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--yel)}
.cd{display:flex;gap:10px;margin:8px 0}.cd div{flex:1;background:var(--in);border-radius:12px;padding:8px;text-align:center;color:var(--mut);font-size:.85rem}.cd b{display:block;font-size:1.9rem;color:var(--tx);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--tx);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;flex:1 1 auto;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:42px;padding:6px 12px;font-size:.9rem;flex:0 0 auto;white-space:nowrap}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn:active{transform:scale(.98)}
.bdg{display:inline-block;font:inherit;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:middle;cursor:default}
button.bdg{cursor:pointer;min-height:28px}
.b-ok{background:rgba(52,211,153,.14);color:var(--grn);border:1px solid var(--grn)}
.b-est{background:rgba(96,165,250,.14);color:var(--blu);border:1px solid var(--blu)}
.b-chk{background:rgba(245,158,11,.14);color:var(--amb);border:1px solid var(--amb)}
.b-me{background:rgba(251,191,36,.12);color:var(--yel);border:1px solid var(--yel)}
.b-need{background:rgba(239,68,68,.14);color:var(--red);border:1px solid var(--red)}
.legend div{margin:6px 0}
.edit{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);background:var(--btn);font-size:1.05rem;cursor:pointer}
.erow{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:4px 0;padding:2px 4px;overflow-wrap:anywhere}
.erow.hid{opacity:.65;padding:4px 10px}
.etx{flex:1;min-width:0;padding:9px 4px;font-size:.92rem;line-height:1.4;cursor:pointer}
.mv{flex:0 0 40px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--btn);color:var(--tx);font-size:1rem}.mv:disabled{opacity:.25}
.ebad{color:var(--red);font-size:.8rem}
.warn{background:rgba(245,158,11,.1);border-left:4px solid var(--amb);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.92rem}
.off{background:rgba(52,211,153,.08);border-left:4px solid var(--grn);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.92rem}
details{margin-top:8px}
summary{cursor:pointer;color:var(--blu);font-weight:600;min-height:40px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";margin-right:4px}
details[open]>summary:before{content:"▾ "}
ol,ul{margin:6px 0;padding-left:22px}li{margin:4px 0}
.src{font-size:.82rem;color:var(--mut);margin-top:8px}
.src a{display:block;margin:3px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;font-size:.85rem}
.grid3 div{background:var(--in);border-radius:10px;padding:6px 8px;min-width:0}
.grid3 b{display:block;color:var(--mut);font-weight:600;font-size:.74rem}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;height:var(--nav);background:none;border:0;color:var(--mut);font:inherit;font-size:.66rem;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 2px}
nav button span{font-size:1.35rem;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
.tabs{display:flex;gap:6px;position:sticky;top:58px;z-index:10;background:var(--bg);padding:8px 0}
.tabs .btn{min-height:44px;padding:6px 4px;font-size:.9rem;flex:1 1 0}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:none;color:transparent;font-size:1.3rem;flex:0 0 44px;cursor:pointer}
.chk.on{background:var(--grn);border-color:var(--grn);color:#fff}
input,select,textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--in);color:var(--tx);font:inherit;padding:8px 10px}
input.sm{min-height:38px;padding:4px 8px}
textarea{min-height:90px}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
#sheet .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:61;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#111;font-size:1.3rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
td:nth-child(2){width:92px}
.bar{height:6px;background:var(--in);border-radius:3px;margin:4px 0;overflow:hidden}.bar i{display:block;height:100%}
.tx{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.kv{margin:4px 0}.kv b{color:var(--mut);font-weight:600}
.pill{font-size:.75rem;background:var(--in);border-radius:999px;padding:2px 8px;color:var(--mut)}
@media (min-width:900px){main{max-width:760px}}
</style>
</head>
<body>
<header>
  <h1>KL × The Weeknd 🎤 <span class="mut" style="font-weight:400">3–5 พ.ย. 2026</span></h1>
  <div class="stripe"></div>
</header>
<main>
  <section class="page on" id="p-now"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-go"></section>
  <section class="page" id="p-money"></section>
  <section class="page" id="p-concert"></section>
  <section class="page" id="p-set"></section>
  <noscript><div class="card">ต้องเปิด JavaScript เพื่อใช้แอปนี้</div></noscript>
</main>
<nav>
  <button data-p="now" class="on"><span>🏠</span>ภาพรวม</button>
  <button data-p="plan"><span>🗓️</span>แพลน</button>
  <button data-p="go"><span>🚇</span>เดินทาง</button>
  <button data-p="money"><span>💰</span>เงิน</button>
  <button data-p="concert"><span>🎤</span>คอนเสิร์ต</button>
  <button data-p="set"><span>⚙️</span>ตั้งค่า</button>
</nav>
<div id="sheet"><button class="x" aria-label="ปิด">✕</button><div class="in"></div></div>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
